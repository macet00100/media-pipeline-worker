name: 🎬 Cool Mèo Phim 24/7 Automation Pipeline (3 Video/Ngày Giờ Vàng)

on:
  schedule:
    # 3 mốc chạy trước Giờ Vàng ~6 tiếng theo giờ Việt Nam (GMT+7):
    # 1. 22:00 UTC (05:00 sáng VN) -> Kịp xuất Gói Xét Duyệt & hẹn giờ Giờ Vàng 11:30
    - cron: '0 22 * * *'
    # 2. 04:00 UTC (11:00 trưa VN) -> Kịp xuất Gói Xét Duyệt & hẹn giờ Giờ Vàng 17:30
    - cron: '0 4 * * *'
    # 3. 07:00 UTC (14:00 chiều VN) -> Kịp xuất Gói Xét Duyệt & hẹn giờ Giờ Vàng 20:30
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      force_source:
        description: 'Kho phim ưu tiên (lz: Lượng Tử, ff: Phi Phàm)'
        required: false
        default: 'lz'
        type: choice
        options:
          - lz
          - ff
      max_videos:
        description: 'Số lượng video sản xuất tối đa trong lượt này'
        required: false
        default: '1'
      max_episodes:
        description: 'Giới hạn số tập xử lý cho mỗi phim (để trống để tự động làm trọn bộ 100%)'
        required: false
        default: ''

# KHÓA CONCURRENCY: Tuyệt đối không cho 2 job chạy song song đè dữ liệu
concurrency:
  group: cool-meo-phim-pipeline-singleton
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # KIỂM SOÁT TỰ ĐỘNG TRÊN PUBLIC REPOSITORY:
    # - Khi bấm tay (workflow_dispatch): Luôn cho phép chạy.
    # - Khi chạy theo cron định kỳ: Chỉ chạy nếu Repo Variable ENABLE_SCHEDULE == 'true'.
    # Giúp bật/tắt chế độ tự động 3 video/ngày ngay trên giao diện GitHub Settings mà không cần sửa code.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'

    # GIỚI HẠN THỜI GIAN: Đảm bảo đoản kịch trọn bộ 60-100 tập render hoàn tất không bị ngắt ngang
    timeout-minutes: 240

    steps:
      - name: 📥 Tải mã nguồn dự án
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🛡️ Che kín mọi Secrets & URLs trong log công khai (Public Log Masking)
        run: |
          # 1. Mask từng API Key trong danh sách GEMINI_API_KEYS (ngăn cách bởi dấu phẩy)
          RAW_KEYS="${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}"
          IFS=',' read -ra ADDR <<< "$RAW_KEYS"
          for key in "${ADDR[@]}"; do
            clean_k=$(echo "$key" | tr -d '[:space:]')
            if [ -n "$clean_k" ] && [ ${#clean_k} -gt 6 ]; then
              echo "::add-mask::$clean_k"
            fi
          done

          # 2. Mask toàn bộ URL và các Secrets quan trọng
          for val in "${{ secrets.LZ_API_URL }}" \
                     "${{ secrets.FF_API_URL }}" \
                     "${{ secrets.FB_PAGE_ID }}" \
                     "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
                     "${{ secrets.TELEGRAM_CHAT_ID }}" \
                     "${{ secrets.FB_ACCESS_TOKEN }}" \
                     "${{ secrets.FB_PAGE_ACCESS_TOKEN }}" \
                     "${{ secrets.YT_CLIENT_ID }}" \
                     "${{ secrets.YT_CLIENT_SECRET }}" \
                     "${{ secrets.YT_REFRESH_TOKEN }}" \
                     "${{ secrets.RCLONE_CONFIG_BASE64 }}"; do
            clean_v=$(echo "$val" | tr -d '[:space:]')
            if [ -n "$clean_v" ] && [ ${#clean_v} -gt 4 ]; then
              echo "::add-mask::$clean_v"
            fi
          done
          echo "✅ Đã kích hoạt add-mask bảo vệ 100% dữ liệu nhạy cảm trên Public Repo."

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Cài đặt FFmpeg, Rclone & Font chữ tiếng Việt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core rclone tor

      - name: 🧅 Thiết lập Tor Proxy Châu Á (Vượt chặn Geo-block Datacenter)
        run: |
          sudo tee /etc/tor/torrc << 'EOF'
          HTTPTunnelPort 9080
          SocksPort 9050
          ControlPort 127.0.0.1:9051
          CookieAuthentication 0
          ExitNodes {hk},{mo},{tw},{jp},{sg}
          StrictNodes 1
          EOF
          sudo systemctl restart tor
          echo "Đang đợi Tor khởi động và thiết lập mạch thoát Châu Á (HK, MO, TW, JP, SG)..."
          for i in {1..35}; do
            if curl -s -x http://127.0.0.1:9080 -m 4 https://check.torproject.org/api/ip | grep -q '"IsTor":true'; then
              TOR_IP=$(curl -s -x http://127.0.0.1:9080 -m 4 https://api.ipify.org || echo "Unknown")
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 6 -x http://127.0.0.1:9080 -A "Mozilla/5.0" "https://v.lzcdn27.com/20261021/19753_d0f36985/index.m3u8" || true)
              echo "Vòng $i: Tor IP=$TOR_IP | CDN Liangzi HTTP=$HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                echo "🎉 XÁC NHẬN THÔNG MẠNG 100% TỚI LIANGZI CDN (HTTP 200 OK)!"
                break
              fi
              # Nếu chưa phải 200, yêu cầu Tor tạo mạch mới qua ControlPort 9051
              python3 -c "import socket; s=socket.create_connection(('127.0.0.1',9051), timeout=3); s.sendall(b'AUTHENTICATE \"\"\r\nSIGNAL NEWNYM\r\n'); print('NEWNYM:', s.recv(1024).decode().strip())" 2>/dev/null || sudo systemctl reload tor || true
            fi
            sleep 2
          done
          echo "Kiểm tra quyền gửi lệnh ControlPort 9051 từ runner..."
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',9051), timeout=3); s.sendall(b'AUTHENTICATE \"\"\r\nSIGNAL NEWNYM\r\n'); res=s.recv(1024).decode(); print('Tor ControlPort Check:', res.strip())" || true

      - name: 📦 Cài đặt thư viện Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Chạy Dry-Run Mock Test kiểm chứng hệ thống
        run: |
          python tests/test_end_to_end_mock.py

      - name: 🚀 Khởi chạy Pipeline Sản Xuất Video (Quản lý qua Cổng QA Gate & Biến AUTO_PUBLISH)
        env:
          PYTHONUNBUFFERED: "1"
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
          AUTO_PUBLISH_YOUTUBE: ${{ vars.AUTO_PUBLISH_YOUTUBE || vars.AUTO_PUBLISH || 'false' }}
          AUTO_PUBLISH_FACEBOOK: ${{ vars.AUTO_PUBLISH_FACEBOOK || vars.AUTO_PUBLISH || 'false' }}
          FB_SOAK_SECONDS: ${{ vars.FB_SOAK_SECONDS || '30' }}
          BACKUP_TO_GDRIVE: ${{ vars.BACKUP_TO_GDRIVE || 'true' }}
          MAX_VIDEOS_PER_RUN: ${{ inputs.max_videos || '1' }}
          PREFERRED_SOURCE: ${{ inputs.force_source || 'lz' }}
          http_proxy: "http://127.0.0.1:9080"
          https_proxy: "http://127.0.0.1:9080"
          no_proxy: "localhost,127.0.0.1,googleapis.com,generativelanguage.googleapis.com,telegram.org,api.telegram.org,github.com,facebook.com,graph.facebook.com,graph-video.facebook.com"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_API_VERSION: "v1beta"
          LZ_API_URL: ${{ secrets.LZ_API_URL }}
          FF_API_URL: ${{ secrets.FF_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
        run: |
          # Làm sạch 100% khoảng trắng và ký tự xuống dòng khỏi các biến môi trường
          export GEMINI_API_KEYS=$(echo -n "$GEMINI_API_KEYS" | tr -d '\r\n[:space:]')
          export GEMINI_API_KEY=$(echo -n "$GEMINI_API_KEY" | tr -d '\r\n[:space:]')
          export GOOGLE_API_KEY=$(echo -n "$GOOGLE_API_KEY" | tr -d '\r\n[:space:]')
          export HTTP_PROXY="$http_proxy"
          export HTTPS_PROXY="$https_proxy"
          export NO_PROXY="$no_proxy"
          
          echo "=== 🌐 KIỂM TRA MẠNG RUNNER VÀ KẾT NỐI TỚI CÁC CDN ==="
          echo "Runner Direct Public IPv4: $(curl -4 --noproxy '*' -s -m 5 https://api.ipify.org || echo 'N/A')"
          echo "Tor Proxy Public IP: $(curl -s -m 8 https://api.ipify.org || echo 'N/A')"
          
          echo "--- Test 1 (Direct): Liangzi v.lzcdn27.com ---"
          curl --noproxy '*' -I -s -m 5 -A "Mozilla/5.0" "https://v.lzcdn27.com/20261021/19753_d0f36985/index.m3u8" | head -n 5 || true

          echo "--- Test 1 (Qua Tor Proxy): Liangzi v.lzcdn27.com ---"
          curl -I -s -m 8 -A "Mozilla/5.0" "https://v.lzcdn27.com/20261021/19753_d0f36985/index.m3u8" | head -n 5 || true

          echo "--- Test 3 (Qua Tor Proxy): Phi Phàm vip.ffzy-play9.com (Referer ffzy1.tv) ---"
          curl -I -s -m 8 -A "Mozilla/5.0" -H "Referer: https://ffzy1.tv/" "https://vip.ffzy-play9.com/20260818/47454_dedf106c/index.m3u8" | head -n 5 || true
          echo "======================================================="

          CMD="python main.py"
          if [ -n "${{ inputs.max_episodes }}" ]; then
            CMD="$CMD --max-episodes ${{ inputs.max_episodes }}"
          fi
          echo "🚀 Thực thi lệnh: $CMD"
          eval "$CMD"

      - name: ☁️ Xuất Gói Xét Duyệt sang Cloud Storage riêng tư (Rclone)
        if: always() && (vars.BACKUP_TO_GDRIVE != 'false')
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE || 'gdrive:CoolMeoPhim/packages' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$RCLONE_CONFIG_BASE64" ]; then
            echo "⚠️ Chưa cấu hình secret RCLONE_CONFIG_BASE64, bỏ qua bước sync."
            exit 0
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          echo "📤 Đang xuất Gói Xét Duyệt sang Cloud Storage riêng tư ($RCLONE_REMOTE/$RUN_NUMBER)..."
          rclone copy output/ "${RCLONE_REMOTE}/${RUN_NUMBER}/" --config ~/.config/rclone/rclone.conf || echo "⚠️ Cảnh báo: Rclone sync không thành công."

      - name: 📢 Gửi báo cáo Xuất Bản / Xét Duyệt qua Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Chưa cấu hình Telegram bot token hoặc chat ID, bỏ qua thông báo."
            exit 0
          fi
          python -c "
          import os, glob, json, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          run_num = os.environ.get('RUN_NUMBER', '0')

          publish_results = glob.glob('output/**/publish_result.json', recursive=True)
          summaries = glob.glob('output/**/REVIEW_SUMMARY.md', recursive=True)
          thumbs = (glob.glob('output/**/thumbnail_horizontal.jpg', recursive=True) or
                    glob.glob('output/**/thumbnail.jpg', recursive=True))

          thumb_path = thumbs[0] if thumbs else None
          msg = ''

          if publish_results:
              try:
                  with open(publish_results[0], 'r', encoding='utf-8') as f:
                      pr = json.load(f)
                  title = pr.get('title', 'Phim Mới')
                  slot_vn = pr.get('schedule_slot', {}).get('slot_vn', 'N/A')
                  yt = pr.get('youtube', {})
                  fb = pr.get('facebook', {})

                  yt_line = f'✅ [Xem video]({yt.get(\"video_url\")})' if yt.get('success') else (f'❌ Lỗi: {yt.get(\"error\")}' if yt.get('error') else 'Chưa cấu hình')
                  fb_line = f'✅ [Xem video]({fb.get(\"video_url\")})' if fb.get('success') else (f'❌ Lỗi: {fb.get(\"error\")}' if fb.get('error') else 'Chưa cấu hình')

                  msg = (
                      f'🚀 *[Cool Mèo Phim] TỰ ĐỘNG XUẤT BẢN #{run_num}*\n\n'
                      f'🎬 *Tác phẩm:* {title}\n'
                      f'⏰ *Giờ Vàng VN:* \`{slot_vn}\`\n\n'
                      f'🔴 *YouTube (Private Scheduled):*\n{yt_line}\n\n'
                      f'🔵 *Facebook Fanpage (Scheduled):*\n{fb_line}\n\n'
                      f'🔒 *Bảo mật: Đã vượt qua 100% Cổng QA Gate và đồng bộ cloud storage.*'
                  )
              except Exception as pe:
                  msg = f'🚀 *[Cool Mèo Phim]* Job #{run_num} đã xuất bản: {pe}'
          elif summaries:
              try:
                  with open(summaries[0], 'r', encoding='utf-8') as f:
                      content = f.read()[:3200]
                  msg = f'🎉 *[Cool Mèo Phim] Gói Xét Duyệt #{run_num} Sẵn Sàng!*\n\n{content}\n\n🔒 *Bảo mật: Gói xét duyệt đã được chuyển đến Cloud Storage riêng tư qua Rclone.*'
              except Exception as se:
                  msg = f'🎉 *[Cool Mèo Phim]* Gói xét duyệt #{run_num} hoàn thành: {se}'
          else:
              msg = f'ℹ️ *[Cool Mèo Phim]* Job #{run_num} đã kết thúc.'

          try:
              if thumb_path and os.path.exists(thumb_path):
                  with open(thumb_path, 'rb') as photo:
                      r = requests.post(
                          f'https://api.telegram.org/bot{token}/sendPhoto',
                          data={'chat_id': chat_id, 'caption': msg[:1024], 'parse_mode': 'Markdown'},
                          files={'photo': photo},
                          timeout=30
                      )
                  if len(msg) > 1024:
                      requests.post(
                          f'https://api.telegram.org/bot{token}/sendMessage',
                          json={'chat_id': chat_id, 'text': msg[1024:], 'parse_mode': 'Markdown'},
                          timeout=20
                      )
              else:
                  requests.post(
                      f'https://api.telegram.org/bot{token}/sendMessage',
                      json={'chat_id': chat_id, 'text': msg[:4000], 'parse_mode': 'Markdown'},
                      timeout=20
                  )
              print('✅ Đã gửi thông báo Telegram thành công!')
          except Exception as e:
              print(f'⚠️ Gửi Telegram thất bại: {e}')
          " || true

      - name: 💾 Đồng bộ cơ sở dữ liệu lịch sử (Chỉ commit processed_db.json, production_queue.json & schedule_calendar.json)
        if: always()
        run: |
          git config --global user.name "CoolMeoBot"
          git config --global user.email "bot@coolmeophim.local"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): auto update state files [skip ci]"
            git pull --rebase origin main
            git push
          fi
          echo "✅ Đã đồng bộ processed_db.json, production_queue.json & schedule_calendar.json lên GitHub."

      - name: 🧹 Dọn dẹp tuyệt đối thư mục tạm và output (Zero Data Leak trên Public Runner)
        if: always()
        run: |
          rm -rf output/ tmp/
          echo "✅ Đã dọn sạch 100% output/ và tmp/ trên GitHub Runner."
